<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F2EC;
    --surface: #EDEAE2;
    --ink: #1A1814;
    --ink-2: #6B6760;
    --ink-3: #A8A49E;
    --accent: #C8440A;
    --accent-light: #F2DDD4;
    --border: rgba(26,24,20,0.1);
    --border-strong: rgba(26,24,20,0.2);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    padding: 3rem 4rem 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
  }

  .site-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.8rem, 5vw, 4.5rem);
    font-weight: 400;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  h1 em { font-style: italic; color: var(--accent); }

  .header-right { text-align: right; padding-bottom: 0.5rem; }

  .count {
    font-family: 'DM Serif Display', serif;
    font-size: 3.5rem;
    font-weight: 400;
    color: var(--accent);
    line-height: 1;
  }

  .count-label { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  .filters {
    display: flex;
    align-items: center;
    padding: 0 4rem;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    position: relative;
    z-index: 1;
  }

  .filter-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-3);
    background: none;
    border: none;
    padding: 1rem 1.25rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }

  .filter-btn:hover { color: var(--ink); }
  .filter-btn.active { color: var(--ink); font-weight: 500; border-bottom-color: var(--accent); }

  .filter-spacer { flex: 1; }

  .search-box {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    margin: 0.65rem 0;
    background: var(--bg);
  }

  .search-box input {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    border: none;
    background: transparent;
    color: var(--ink);
    outline: none;
    width: 160px;
  }

  .search-box input::placeholder { color: var(--ink-3); }
  .search-box svg { color: var(--ink-3); flex-shrink: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1px;
    background: var(--border);
    position: relative;
    z-index: 1;
    min-height: 200px;
  }

  /* loading & empty states */
  .state-msg {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    gap: 0.75rem;
    background: var(--bg);
  }

  .state-msg p { font-size: 14px; color: var(--ink-3); text-align: center; line-height: 1.6; }

  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .card {
    background: var(--bg);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card:hover { background: var(--surface); }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }

  .type-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .type-competitive { background: #E8F0FB; color: #1A4A8A; }
  .type-industry    { background: #EAF5E9; color: #1A5E2A; }
  .type-ux          { background: #F5EAF8; color: #6A1A8A; }
  .type-trend       { background: #FEF3E2; color: #8A4A00; }
  .type-case        { background: var(--accent-light); color: var(--accent); }

  .card-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-3); }

  .card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
    line-height: 1.25;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .card-product {
    font-size: 12px;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-product::before {
    content: '';
    width: 18px;
    height: 1px;
    background: var(--ink-3);
    display: inline-block;
  }

  .card-insight {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.6;
    border-left: 2px solid var(--accent-light);
    padding-left: 0.75rem;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }

  .card-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-3); }

  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; }

  .tag {
    font-size: 10px;
    color: var(--ink-3);
    background: var(--surface);
    padding: 2px 7px;
    border-radius: 99px;
    border: 1px solid var(--border);
  }

  .card-arrow {
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.15s, transform 0.15s;
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
    flex-shrink: 0;
  }

  .card:hover .card-arrow { opacity: 1; transform: translateX(0); }

  /* featured card */
  .card.featured {
    grid-column: span 2;
    flex-direction: row;
    gap: 2.5rem;
    align-items: stretch;
    background: var(--ink);
  }

  .card.featured:hover { background: #2A2820; }
  .card.featured .card-title { color: white; font-size: 1.6rem; }
  .card.featured .card-product { color: rgba(255,255,255,0.4); }
  .card.featured .card-product::before { background: rgba(255,255,255,0.3); }
  .card.featured .card-insight { color: rgba(255,255,255,0.65); border-left-color: rgba(200,68,10,0.5); }
  .card.featured .card-date { color: rgba(255,255,255,0.3); }
  .card.featured .card-footer { border-top-color: rgba(255,255,255,0.1); }
  .card.featured .tag { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); }
  .card.featured .card-num { color: rgba(255,255,255,0.2); }
  .card.featured .type-badge { background: rgba(200,68,10,0.2); color: #F2A080; }
  .card.featured .card-arrow { color: #F2A080; }

  .featured-left { flex: 1; display: flex; flex-direction: column; gap: 1rem; }
  .featured-right {
    width: 160px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }

  .featured-big-num {
    font-family: 'DM Serif Display', serif;
    font-size: 6rem;
    font-weight: 400;
    color: rgba(255,255,255,0.07);
    line-height: 1;
  }

  footer {
    padding: 2rem 4rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  footer p { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; }

  .add-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: white;
    background: var(--accent);
    border: none;
    padding: 0.6rem 1.25rem;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .add-btn:hover { opacity: 0.85; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  header { animation: fadeUp 0.45s ease both; }
  .filters { animation: fadeUp 0.45s 0.07s ease both; }
  .card { animation: fadeUp 0.4s ease both; }

  @media (max-width: 700px) {
    header { padding: 2rem; flex-direction: column; gap: 1rem; }
    .filters { padding: 0 1.5rem; }
    .card.featured { grid-column: span 1; flex-direction: column; }
    .featured-right { display: none; }
    footer { padding: 1.5rem 2rem; flex-direction: column; gap: 1rem; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div>
    <p class="site-label">Research Library — 2024</p>
    <h1>Product<br><em>Research</em></h1>
  </div>
  <div class="header-right">
    <div class="count" id="total-count">—</div>
    <div class="count-label">reports collected</div>
  </div>
</header>

<nav class="filters">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('competitive', this)">竞品分析</button>
  <button class="filter-btn" onclick="setFilter('industry', this)">行业报告</button>
  <button class="filter-btn" onclick="setFilter('ux', this)">UX Research</button>
  <button class="filter-btn" onclick="setFilter('trend', this)">趋势</button>
  <button class="filter-btn" onclick="setFilter('case', this)">案例</button>
  <div class="filter-spacer"></div>
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="搜索报告…" oninput="setSearch(this.value)">
  </div>
</nav>

<main class="grid" id="grid">
  <div class="state-msg">
    <div class="spinner"></div>
    <p>载入报告中…</p>
  </div>
</main>

<footer>
  <p>RESEARCH LIBRARY — PERSONAL USE ONLY</p>
  <!-- ✏️ 把下面的 href 换成你的 Google Sheet 链接 -->
  <a class="add-btn" id="sheet-link" href="https://docs.google.com/spreadsheets" target="_blank">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    添加报告
  </a>
</footer>

<script>
  // ══════════════════════════════════════════════
  // ✏️  把这里换成你的 Google Sheets CSV 链接
  //     File → Share → Publish to web → CSV → 复制链接
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOYCiHMtVQ1BuehVN5PTOm4_nrNEFAerIKrcldd0VDT4YLe1BVY3-7NHRRby3b1HyXLmBU0JLfAYZE/pub?output=csv';

  const SHEET_EDIT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOYCiHMtVQ1BuehVN5PTOm4_nrNEFAerIKrcldd0VDT4YLe1BVY3-7NHRRby3b1HyXLmBU0JLfAYZE/pub?output=csv';
  // ══════════════════════════════════════════════

  let allData = [];
  let currentFilter = 'all';
  let currentSearch = '';

  const typeLabels = {
    competitive: '竞品分析',
    industry:    '行业报告',
    ux:          'UX Research',
    trend:       '趋势',
    case:        '案例',
  };

  document.getElementById('sheet-link').href = SHEET_EDIT_URL;

  async function loadData() {
    try {
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(SHEET_CSV_URL)}`;
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('fetch failed');
      const text = await res.text();
      allData = parseCSV(text);
      document.getElementById('total-count').textContent = allData.length;
      render();
    } catch (e) {
      document.getElementById('grid').innerHTML = `
        <div class="state-msg">
          <p>无法载入资料。<br>请确认 Google Sheets CSV 链接已正确填入，<br>且表格已发布为公开。</p>
        </div>`;
    }
  }

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
      const values = line.match(/(".*?"|[^,]+)(?=,|$)/g) || [];
      const obj = {};
      headers.forEach((h, i) => {
        obj[h] = (values[i] || '').replace(/^"|"$/g, '').trim();
      });
      return obj;
    }).filter(r => r.title);
  }

  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function setSearch(val) {
    currentSearch = val.toLowerCase();
    render();
  }

  function render() {
    const filtered = allData.filter((r, i) => {
      const matchType = currentFilter === 'all' || r.type === currentFilter;
      const matchSearch = !currentSearch ||
        r.title.toLowerCase().includes(currentSearch) ||
        (r.product || '').toLowerCase().includes(currentSearch) ||
        (r.insight || '').toLowerCase().includes(currentSearch);
      return matchType && matchSearch;
    });

    if (!filtered.length) {
      document.getElementById('grid').innerHTML = `
        <div class="state-msg"><p>没有符合的报告。</p></div>`;
      return;
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = filtered.map((r, i) => buildCard(r, i)).join('');

    grid.querySelectorAll('.card').forEach((el, i) => {
      el.style.animationDelay = `${i * 0.05}s`;
    });
  }

  function buildCard(r, i) {
    const title = r['Title'] || r['title'] || '';
    const product = r['Product'] || r['product'] || '';
    const appliedTo = r['Applied To'] || r['applied to'] || '';
    const type = (r['Type'] || r['type'] || 'ux').toLowerCase().replace(/\s+/g, '');
    const insight = r['Insight'] || r['insight'] || '';
    const date = r['Date'] || r['date'] || '';
    const tagsRaw = r['Tags'] || r['tags'] || '';
    const num = r['No'] || r['num'] || String(i+1);

    const tags = tagsRaw.split(',').map(t => t.trim()).filter(Boolean);
    const tagHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

    const typeKey = type.includes('ux') ? 'ux'
      : type.includes('comp') ? 'competitive'
      : type.includes('ind') ? 'industry'
      : type.includes('trend') ? 'trend'
      : type.includes('case') ? 'case'
      : 'ux';

    const typeClass = `type-${typeKey}`;
    const typeLabel = typeLabels[typeKey] || type || '其他';
    const isFeatured = i === 0;
    const subline = appliedTo ? `${product} → ${appliedTo}` : product;

    if (isFeatured) {
      return `
        <div class="card featured" data-type="${typeKey}">
          <div class="featured-left">
            <div class="card-top">
              <span class="type-badge ${typeClass}">${typeLabel}</span>
              <span class="card-num">#${String(num).padStart(3,'0')}</span>
            </div>
            <div class="card-title">${title}</div>
            <p class="card-product">${subline}</p>
            <p class="card-insight">${insight}</p>
            <div class="card-footer">
              <span class="card-date">${date}</span>
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="card-tags">${tagHTML}</div>
                <span class="card-arrow">→</span>
              </div>
            </div>
          </div>
          <div class="featured-right">
            <div class="featured-big-num">${String(i+1).padStart(2,'0')}</div>
          </div>
        </div>`;
    }

    return `
      <div class="card" data-type="${typeKey}">
        <div class="card-top">
          <span class="type-badge ${typeClass}">${typeLabel}</span>
          <span class="card-num">#${String(num).padStart(3,'0')}</span>
        </div>
        <div class="card-title">${title}</div>
        <p class="card-product">${subline}</p>
        <p class="card-insight">${insight}</p>
        <div class="card-footer">
          <span class="card-date">${date}</span>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="card-tags">${tagHTML}</div>
            <span class="card-arrow">→</span>
          </div>
        </div>
      </div>`;
  }

  loadData();
</script>
</body>
</html>
